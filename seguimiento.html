<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Consulta tu orden · Nexotik</title>
<meta name="description" content="Consulta el estado de tu equipo en Nexotik con tu número de orden y tu código.">
<link rel="icon" type="image/svg+xml" href="img/nexotik-icono.svg">
<link rel="apple-touch-icon" href="img/nexotik-icono-180.png">
<meta name="theme-color" content="#060d1f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#060d1f; --panel:#0e1b3a; --line:#1f3466;
  --blue:#1f7bff; --blue-2:#4fb3ff; --wa:#25d366;
  --paper:#dde9fb; --card:#f4f8ff; --ink:#0b1733; --muted:#4b5e82; --muted-d:#93a4cc; --hair:#bcd0ee;
  --ok:#16a34a; --bad:#dc2626;
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;overflow-x:clip}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:300;margin:0;line-height:1.1;letter-spacing:-.015em}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:radial-gradient(600px 300px at 90% 0%,#123d93,transparent 70%),var(--navy);color:#e9efff;padding:calc(18px + env(safe-area-inset-top,0px)) 0 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.top img{display:block;height:58px;width:auto}
.top a.back{font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#c9d5f2;text-decoration:none}
.top a.back:hover{color:var(--blue-2)}
header h1{font-size:clamp(2rem,6vw,2.8rem);color:#fff;margin-top:40px}
header h1 em{font-style:normal;color:var(--blue-2)}
header p{color:var(--muted-d);margin:10px 0 0;max-width:46ch}

main{margin-top:-64px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:24px;box-shadow:0 24px 50px -30px rgba(6,13,31,.5)}
.card+.card{margin-top:14px}
form.q{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
@media (max-width:620px){form.q{grid-template-columns:1fr}}
label span{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:5px}
input{width:100%;font:500 1rem var(--body);padding:11px 13px;border:1.5px solid var(--hair);border-radius:10px;background:#fff;color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
input:focus{outline:none;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 .8rem var(--body);letter-spacing:.1em;text-transform:uppercase;padding:13px 20px;border-radius:10px;border:0;cursor:pointer;text-decoration:none;background:var(--blue);color:#fff}
.btn:hover{background:#1569e0}
.btn:disabled{opacity:.6;cursor:default}
.btn-wa{background:var(--wa);color:#04210f}
.btn-wa:hover{background:#1fbd5b}
.btn svg{width:18px;height:18px}
.hint{margin:12px 0 0;font-size:.84rem;color:var(--muted)}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;background:#fff1f1;color:#9b1c1c;font-size:.9rem}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head small{display:block;font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.head h2{font-size:1.7rem;margin-top:4px}
.head p{margin:4px 0 0;color:var(--muted)}
.tag{display:inline-block;padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:600;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);border:1.5px solid var(--c)}

.steps{list-style:none;margin:26px 0 6px;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.steps::before{content:"";position:absolute;left:10%;right:10%;top:17px;height:2px;background:var(--hair)}
.steps .fill{position:absolute;left:10%;top:17px;height:2px;background:var(--blue);width:calc(80% * var(--k,0))}
.steps li{position:relative;text-align:center;font-size:.8rem;color:var(--muted);padding:0 4px}
.steps li i{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 8px;border-radius:50%;background:#fff;border:2px solid var(--hair);font-style:normal;font-weight:600;font-family:var(--display);color:var(--muted);position:relative}
.steps li.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.steps li.now i{box-shadow:0 0 0 6px rgba(31,123,255,.18)}
.steps li.now b{color:var(--ink)}
.steps b{display:block;font-weight:600}
@media (max-width:620px){
  .steps{grid-template-columns:1fr;gap:14px}
  .steps::before,.steps .fill{display:none}
  .steps li{display:flex;align-items:center;gap:12px;text-align:left}
  .steps li i{margin:0;flex:none}
}
.note{margin-top:18px;padding:14px 16px;border-radius:12px;background:#e8f0fd;color:var(--ink);font-size:.92rem}
.note.ok{background:#e7f8ee}
.note.off{background:#f1f3f7;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.grid div span{display:block;font-size:.75rem;font-weight:500;color:var(--muted)}
.grid div p{margin:2px 0 0;white-space:pre-line}
h3{font-size:1.15rem;font-weight:400;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:9px 0;border-bottom:1px solid var(--hair);vertical-align:top}
td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted)}
.tot{display:grid;gap:4px;justify-items:end;margin-top:12px}
.tot div{display:flex;justify-content:space-between;gap:30px;min-width:240px;font-variant-numeric:tabular-nums}
.tot .big{font-family:var(--display);font-size:1.3rem}
.saldo{color:var(--bad)}.pagado{color:var(--ok)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px calc(30px + env(safe-area-inset-bottom,0px))}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.1c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-5-4.3-5.1-4.5-.2-.2-1.2-1.6-1.2-3.1s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.7-.1 1.4z"/></symbol>
</defs></svg>

<header>
  <div class="wrap">
    <div class="top"><a href="index.html"><img src="img/nexotik-logo.svg?v=2" alt="Nexotik. Tu tecnología, en buenas manos." width="220" height="58"></a><a class="back" href="index.html">← Volver al inicio</a></div>
    <h1>Consulta tu <em>orden</em></h1>
    <p>Mira en qué va tu equipo con el número de orden y el código que aparecen en tu orden impresa.</p>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <form class="q" id="fq" novalidate>
      <label><span>Número de orden</span><input id="n" placeholder="NX-0001" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      <label><span>Código</span><input id="c" placeholder="ABC123" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      <button class="btn" type="submit" id="go">Consultar</button>
    </form>
    <p class="hint">¿No tienes el código? Escanea el código QR de tu orden impresa o escríbenos por WhatsApp.</p>
    <div class="msg" id="msg" role="alert" hidden></div>
  </div>
  <div id="res" aria-live="polite"></div>
</main>

<footer>© <span id="anio">2026</span> Nexotik · Tu tecnología, en buenas manos.</footer>

<script src="js/supabase-config.js"></script>
<script>
(function(){
const CFG=window.NEXOTIK_SB||{};
const WA='573218757723';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));
const fdate=s=>{if(!s)return '';const [y,m,d]=String(s).slice(0,10).split('-');return `${d}/${m}/${y}`};
const PASOS=[['recibido','Recibido'],['diagnostico','En diagnóstico'],['reparacion','En reparación'],['listo','Listo para entregar'],['entregado','Entregado']];
const COLOR={recibido:'#1f7bff',diagnostico:'#7c3aed',reparacion:'#d97706',listo:'#0891b2',entregado:'#16a34a',cancelado:'#6b7280'};
const TEXTO={
  recibido:'Recibimos tu equipo. Pronto empezamos a revisarlo.',
  diagnostico:'Estamos revisando tu equipo para encontrar la falla. Te contactaremos con la solución y el costo antes de hacer cualquier trabajo.',
  reparacion:'Estamos trabajando en tu equipo.',
  listo:'¡Tu equipo está listo! Puedes pasar a recogerlo. Recuerda llevar tu orden impresa.',
  entregado:'Tu equipo ya fue entregado. ¡Gracias por confiar en nosotros!',
  cancelado:'Esta orden fue cancelada. Si tienes dudas, escríbenos por WhatsApp.'
};
$('#anio').textContent=new Date().getFullYear();

function mostrarError(t){const m=$('#msg');m.textContent=t;m.hidden=!t}

async function consultar(num,cod){
  if(!CFG.url||!CFG.key){mostrarError('La consulta en línea todavía no está disponible. Escríbenos por WhatsApp.');return}
  const b=$('#go');b.disabled=true;b.innerHTML='<i class="spin"></i>';mostrarError('');
  try{
    const r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/rpc/consultar_orden',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+CFG.key},
      body:JSON.stringify({p_num:num,p_codigo:cod})});
    if(!r.ok)throw new Error(r.status);
    const o=await r.json();
    if(!o){$('#res').innerHTML='';mostrarError('No encontramos una orden con esos datos. Revisa el número y el código de tu orden impresa.');return}
    pintar(o);
    const u=new URL(location.href);u.searchParams.set('n',num);u.searchParams.set('c',cod);history.replaceState(null,'',u);
  }catch(e){mostrarError('No pudimos consultar en este momento. Revisa tu conexión e intenta de nuevo.')}
  finally{b.disabled=false;b.textContent='Consultar'}
}

function pintar(o){
  const est=o.estado||'recibido',idx=PASOS.findIndex(p=>p[0]===est),cancel=est==='cancelado';
  const eq=[o.equipo&&o.equipo.tipo,o.equipo&&o.equipo.marca,o.equipo&&o.equipo.modelo].filter(Boolean).join(' ');
  let gar='';
  if(est==='entregado'&&o.entregadoEn&&o.garantia>0){
    const d=new Date(o.entregadoEn+'T12:00:00');d.setDate(d.getDate()+o.garantia);
    const vig=d>=new Date(),f=d.toISOString().slice(0,10);
    gar=vig?`<div class="note ok"><b>Garantía vigente</b> hasta el ${fdate(f)} (${o.garantia} días desde la entrega). Cubre el trabajo realizado.</div>`
           :`<div class="note off">La garantía de ${o.garantia} días terminó el ${fdate(f)}.</div>`;
  }
  const fechas=[o.recibido&&['Recibido',fdate(o.recibido)],
    est==='entregado'&&o.entregadoEn?['Entregado',fdate(o.entregadoEn)]:(!cancel&&o.entrega&&['Entrega estimada',fdate(o.entrega)])].filter(Boolean);
  const items=(o.items||[]).filter(i=>i.servicio||i.valor);
  const msg=`Hola, quiero preguntar por mi orden ${o.num}.`;
  $('#res').innerHTML=`
  <div class="card" style="margin-top:14px">
    <div class="head"><div><small>Orden ${esc(o.num)}</small><h2>${o.cliente?'Hola, '+esc(o.cliente):'Tu equipo'}</h2><p>${esc(eq||'Equipo')}</p></div>
      <span class="tag" style="--c:${COLOR[est]||'#6b7280'}">${esc(cancel?'Cancelada':(PASOS[idx]||[,est])[1])}</span></div>
    ${cancel?'':`<ol class="steps" style="--k:${Math.max(0,idx)/(PASOS.length-1)}"><span class="fill"></span>${PASOS.map((p,i)=>`<li class="${i<=idx?'done':''} ${i===idx?'now':''}" ${i===idx?'aria-current="step"':''}><i>${i<idx?'✓':i+1}</i><b>${p[1]}</b></li>`).join('')}</ol>`}
    <div class="note ${cancel?'off':est==='listo'||est==='entregado'?'ok':''}">${TEXTO[est]||''}</div>
    ${gar}
  </div>
  <div class="card">
    <h3>Detalles</h3>
    <div class="grid">
      ${fechas.map(f=>`<div><span>${f[0]}</span><p>${f[1]}</p></div>`).join('')}
      ${o.falla?`<div style="grid-column:1/-1"><span>Falla reportada</span><p>${esc(o.falla)}</p></div>`:''}
      ${o.diagnostico?`<div style="grid-column:1/-1"><span>Diagnóstico</span><p>${esc(o.diagnostico)}</p></div>`:''}
    </div>
  </div>
  ${items.length&&o.total>0?`<div class="card">
    <h3>Servicios y valores</h3>
    <table><tbody>${items.map(i=>`<tr><td>${esc(i.servicio)}${i.desc?`<small>${esc(i.desc)}</small>`:''}</td><td class="r">${i.valor?money(i.valor):''}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><div><span>Total</span><b>${money(o.total)}</b></div><div><span>Pagado</span><span class="pagado">${money(o.pagado)}</span></div>
      <div class="big"><span>${o.saldo>0?'Saldo pendiente':'Saldo'}</span><span class="${o.saldo>0?'saldo':'pagado'}">${o.saldo>0?money(o.saldo):'Pagado'}</span></div></div>
  </div>`:''}
  <div class="card"><h3>¿Tienes alguna pregunta?</h3><p style="margin:0;color:var(--muted)">Escríbenos por WhatsApp con tu número de orden y te respondemos.</p>
    <div class="acts"><a class="btn btn-wa" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><svg><use href="#i-wa"/></svg>Escribir por WhatsApp</a></div></div>`;
  $('#res').firstElementChild.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}

$('#fq').onsubmit=e=>{e.preventDefault();const n=$('#n').value.trim().toUpperCase(),c=$('#c').value.trim().toUpperCase();
  if(!n||!c){mostrarError('Escribe el número de orden y el código.');return}consultar(n,c)};
['n','c'].forEach(id=>$('#'+id).addEventListener('input',()=>mostrarError('')));

const q=new URLSearchParams(location.search);
if(q.get('n')&&q.get('c')){$('#n').value=q.get('n').toUpperCase();$('#c').value=q.get('c').toUpperCase();consultar($('#n').value,$('#c').value)}
})();
</script>
</body>
</html>
